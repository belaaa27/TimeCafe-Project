<!DOCTYPE html>
<html lang="en" class="h-full bg-slateBg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Staff Management | TimeCafe Admin</title>

  <!-- Compiled Tailwind CSS -->
  <link rel="stylesheet" href="../css/output.css">

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    /* Hide scrollbar for clean horizontal scrolling on mobile */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="font-sans antialiased text-slate-800 bg-slateBg min-h-screen flex flex-col">

  <!-- Top Navigation Bar -->
  <header class="bg-slateDark text-white border-b border-slate-800 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between gap-2">
      
      <!-- Logo & Header Title -->
      <div class="flex items-center gap-2.5 sm:gap-3 min-w-0">
        <div class="w-8 h-8 sm:w-9 sm:h-9 bg-adminAccent rounded-lg flex items-center justify-center text-white font-bold text-base sm:text-lg shadow flex-shrink-0">
          <i class="fa-solid fa-users-gear"></i>
        </div>
        <span class="font-bold text-base sm:text-lg tracking-tight text-slate-100 truncate">
          TimeCafe <span class="hidden sm:inline text-slate-400 text-sm font-normal">| Staff Center</span>
        </span>
      </div>

      <!-- User Role & Logout -->
      <div class="flex items-center gap-2 sm:gap-4 flex-shrink-0">
        <span id="adminUserBadge" class="px-2.5 py-1 bg-slatePanel border border-slate-700 text-slate-300 text-[10px] sm:text-xs font-semibold rounded-full uppercase tracking-wider">
          Role: Loading...
        </span>
        <button onclick="logoutAdmin()" class="text-slate-400 hover:text-white text-xs sm:text-sm font-medium transition flex items-center gap-1.5 px-2 py-1 rounded-lg hover:bg-slate-800">
          <i class="fa-solid fa-right-from-bracket"></i>
          <span class="hidden sm:inline">Logout</span>
        </button>
      </div>

    </div>
  </header>

  <!-- Secondary Navigation -->
  <nav class="bg-slatePanel border-b border-slate-700/50 sticky top-16 z-40">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex gap-1 overflow-x-auto no-scrollbar whitespace-nowrap">
      <a href="dashboard.html" class="px-3.5 sm:px-4 py-3 text-xs sm:text-sm font-medium text-slate-400 hover:text-slate-200 border-b-2 border-transparent hover:border-slate-600 flex items-center gap-2 transition flex-shrink-0">
        <i class="fa-solid fa-chart-line text-xs"></i> Dashboard
      </a>
      <a href="orders.html" class="px-3.5 sm:px-4 py-3 text-xs sm:text-sm font-medium text-slate-400 hover:text-slate-200 border-b-2 border-transparent hover:border-slate-600 flex items-center gap-2 transition flex-shrink-0">
        <i class="fa-solid fa-receipt text-xs"></i> Orders
      </a>
      <a href="products.html" class="px-3.5 sm:px-4 py-3 text-xs sm:text-sm font-medium text-slate-400 hover:text-slate-200 border-b-2 border-transparent hover:border-slate-600 flex items-center gap-2 transition flex-shrink-0">
        <i class="fa-solid fa-pizza-slice text-xs"></i> Products
      </a>
      <a href="staff.html" class="superadmin-only px-3.5 sm:px-4 py-3 text-xs sm:text-sm font-medium border-b-2 border-adminAccent text-white bg-slate-800/50 flex items-center gap-2 flex-shrink-0">
        <i class="fa-solid fa-users text-xs"></i> Staff
      </a>
    </div>
  </nav>

  <!-- Main Content Container -->
  <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 sm:py-8 space-y-6">

    <!-- Header Actions -->
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 pb-2 border-b border-slate-200">
      <div>
        <h1 class="text-xl sm:text-2xl font-bold text-slate-900 tracking-tight">Staff Management</h1>
        <p class="text-xs sm:text-sm text-slate-500 mt-0.5">Manage administrative user accounts, authorization roles, and system credentials.</p>
      </div>

      <button onclick="openStaffModal()" class="w-full sm:w-auto px-4 py-2.5 bg-adminAccent hover:bg-adminAccentHover text-white text-sm font-semibold rounded-xl shadow-sm transition flex items-center justify-center gap-2">
        <i class="fa-solid fa-user-plus text-xs"></i> Add Staff Member
      </button>
    </div>

    <!-- Staff Data Table Container -->
    <div class="bg-white border border-slate-200 rounded-xl shadow-sm overflow-hidden">
      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm text-slate-600 min-w-[550px] sm:min-w-full">
          <thead class="bg-slate-100 text-slate-700 uppercase text-[11px] sm:text-xs font-semibold tracking-wider border-b border-slate-200">
            <tr>
              <th class="py-3 px-4 sm:px-6">Name</th>
              <th class="py-3 px-4 sm:px-6">Email</th>
              <th class="py-3 px-4 sm:px-6">Role</th>
              <th class="py-3 px-4 sm:px-6 hidden md:table-cell">Created At</th>
              <th class="py-3 px-4 sm:px-6 text-right">Actions</th>
            </tr>
          </thead>
          <tbody id="staffTableBody" class="divide-y divide-slate-200 bg-white">
            <tr>
              <td colspan="5" class="py-12 text-center text-slate-400">
                <i class="fa-solid fa-spinner animate-spin text-lg mr-2 text-adminAccent"></i> Loading staff accounts...
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

  </main>

  <!-- Add/Edit Staff Modal Overlay -->
  <div id="staffModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-3 sm:p-4 hidden overflow-y-auto">
    <div class="bg-white rounded-2xl shadow-xl w-full max-w-md my-auto overflow-hidden transform transition-all border border-slate-100 max-h-[90vh] flex flex-col">

      <!-- Modal Header -->
      <div class="bg-slateDark px-5 sm:px-6 py-4 flex items-center justify-between text-white flex-shrink-0">
        <h2 id="modalTitle" class="text-base font-bold flex items-center gap-2">
          <i class="fa-solid fa-user-shield text-adminAccent"></i> Add Staff Member
        </h2>
        <button onclick="closeStaffModal()" class="text-slate-400 hover:text-white transition p-1">
          <i class="fa-solid fa-xmark text-lg"></i>
        </button>
      </div>

      <!-- Modal Form -->
      <form id="staffForm" class="p-5 sm:p-6 space-y-4 overflow-y-auto">
        <input type="hidden" id="staffId">

        <div>
          <label for="staffName" class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1.5">Full Name</label>
          <input type="text" id="staffName" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3.5 py-2 text-sm text-slate-800 focus:outline-none focus:border-adminAccent focus:ring-1 focus:ring-adminAccent transition" required>
        </div>

        <div>
          <label for="staffEmail" class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1.5">Email Address</label>
          <input type="email" id="staffEmail" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3.5 py-2 text-sm text-slate-800 focus:outline-none focus:border-adminAccent focus:ring-1 focus:ring-adminAccent transition" required>
        </div>

        <div>
          <label for="staffPassword" class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1.5">Password</label>
          <input type="password" id="staffPassword" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3.5 py-2 text-sm text-slate-800 focus:outline-none focus:border-adminAccent focus:ring-1 focus:ring-adminAccent transition" placeholder="Leave blank to keep existing password">
        </div>

        <div>
          <label for="staffRole" class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1.5">Role</label>
          <select id="staffRole" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3.5 py-2 text-sm text-slate-800 focus:outline-none focus:border-adminAccent focus:ring-1 focus:ring-adminAccent transition" required>
            <option value="admin">Standard Admin</option>
            <option value="super_admin">Superadmin</option>
          </select>
        </div>

        <!-- Form Actions -->
        <div class="flex items-center justify-end gap-3 pt-4 border-t border-slate-100 flex-shrink-0">
          <button type="button" onclick="closeStaffModal()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold rounded-xl transition">Cancel</button>
          <button type="submit" class="px-4 py-2 bg-adminAccent hover:bg-adminAccentHover text-white text-xs font-semibold rounded-xl shadow transition">Save Staff Account</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Scripts -->
  <script src="js/admin-auth.js"></script>
  <script src="../js/api.js"></script>
  <script src="js/admin-staff.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const auth = checkAdminAuth("super_admin");

      if (auth) {
        const userBadge = document.getElementById("adminUserBadge");
        if (userBadge) userBadge.innerText = `Role: ${auth.role.toUpperCase()}`;
      }
    });
  </script>
</body>
</html>
