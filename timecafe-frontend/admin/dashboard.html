<!DOCTYPE html>
<html lang="en" class="h-full bg-slateBg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard | TimeCafe</title>

  <!-- Compiled Tailwind CSS -->
  <link rel="stylesheet" href="../css/output.css">
  
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="font-sans antialiased text-slate-800 bg-slateBg min-h-screen flex flex-col">

<!-- Top Navigation Bar -->
<header class="bg-slateDark text-white border-b border-slate-800 sticky top-0 z-50">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between gap-2">
    <!-- Brand -->
    <div class="flex items-center gap-2.5 min-w-0">
      <div class="w-8 h-8 sm:w-9 sm:h-9 bg-adminAccent rounded-lg flex-shrink-0 flex items-center justify-center text-white font-bold text-base sm:text-lg shadow">
        <i class="fa-solid fa-gauge"></i>
      </div>
      <span class="font-bold text-base sm:text-lg tracking-tight text-slate-100 truncate">
        TimeCafe <span class="hidden sm:inline text-slate-400 text-sm font-normal">| Admin Control</span>
      </span>
    </div>

    <!-- Right Controls -->
    <div class="flex items-center gap-2 sm:gap-4 flex-shrink-0">
      <span id="adminUserBadge" class="px-2.5 py-1 bg-slatePanel border border-slate-700 text-slate-300 text-[10px] sm:text-xs font-semibold rounded-full uppercase tracking-wider">
        Role: Loading...
      </span>
      <button onclick="logoutAdmin()" class="text-slate-400 hover:text-white text-xs sm:text-sm font-medium transition flex items-center gap-1.5 p-1">
        <i class="fa-solid fa-right-from-bracket"></i>
        <span class="hidden sm:inline">Logout</span>
      </button>
    </div>
  </div>
</header>

<!-- Secondary Navigation (Touch-scrollable on mobile) -->
<nav class="bg-slatePanel border-b border-slate-700/50 sticky top-16 z-40 overflow-x-auto scrollbar-none">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex gap-1 whitespace-nowrap min-w-max">
    <a href="dashboard.html" class="px-3.5 sm:px-4 py-3 text-xs sm:text-sm font-medium border-b-2 border-adminAccent text-white bg-slate-800/50 flex items-center gap-2">
      <i class="fa-solid fa-chart-line"></i> Dashboard
    </a>
    <a href="orders.html" class="px-3.5 sm:px-4 py-3 text-xs sm:text-sm font-medium text-slate-400 hover:text-slate-200 border-b-2 border-transparent hover:border-slate-600 flex items-center gap-2 transition">
      <i class="fa-solid fa-receipt"></i> Orders
    </a>
    <a href="products.html" class="px-3.5 sm:px-4 py-3 text-xs sm:text-sm font-medium text-slate-400 hover:text-slate-200 border-b-2 border-transparent hover:border-slate-600 flex items-center gap-2 transition">
      <i class="fa-solid fa-pizza-slice"></i> Products
    </a>
    <a href="staff.html" class="superadmin-only px-3.5 sm:px-4 py-3 text-xs sm:text-sm font-medium text-slate-400 hover:text-slate-200 border-b-2 border-transparent hover:border-slate-600 flex items-center gap-2 transition">
      <i class="fa-solid fa-users"></i> Staff
    </a>
  </div>
</nav>

<!-- Main Content -->
<main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 sm:py-8 space-y-6 sm:space-y-8">
  
  <!-- Page Title -->
  <div>
    <h1 class="text-xl sm:text-2xl font-bold text-slate-900 tracking-tight">System Overview</h1>
    <p class="text-xs sm:text-sm text-slate-500">Real-time store metrics and recent order activity.</p>
  </div>

  <!-- Stats Cards Grid -->
  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 sm:gap-6">
    
    <!-- Total Sales -->
    <div class="bg-white p-5 sm:p-6 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between">
      <div>
        <p class="text-[11px] sm:text-xs font-semibold text-slate-500 uppercase tracking-wider">Total Sales</p>
        <p id="statSales" class="text-xl sm:text-2xl font-bold text-slate-900 mt-1">Br 0.00</p>
      </div>
      <div class="w-10 h-10 sm:w-12 sm:h-12 bg-emerald-50 text-emerald-600 rounded-xl flex items-center justify-center text-lg sm:text-xl flex-shrink-0">
        <i class="fa-solid fa-money-bill-wave"></i>
      </div>
    </div>

    <!-- Pending Orders -->
    <div class="bg-white p-5 sm:p-6 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between">
      <div>
        <p class="text-[11px] sm:text-xs font-semibold text-slate-500 uppercase tracking-wider">Pending Orders</p>
        <p id="statPending" class="text-xl sm:text-2xl font-bold text-slate-900 mt-1">0</p>
      </div>
      <div class="w-10 h-10 sm:w-12 sm:h-12 bg-amber-50 text-amber-600 rounded-xl flex items-center justify-center text-lg sm:text-xl flex-shrink-0">
        <i class="fa-solid fa-clock"></i>
      </div>
    </div>

    <!-- Total Products -->
    <div class="bg-white p-5 sm:p-6 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between sm:col-span-2 lg:col-span-1">
      <div>
        <p class="text-[11px] sm:text-xs font-semibold text-slate-500 uppercase tracking-wider">Total Products</p>
        <p id="statProducts" class="text-xl sm:text-2xl font-bold text-slate-900 mt-1">0</p>
      </div>
      <div class="w-10 h-10 sm:w-12 sm:h-12 bg-blue-50 text-blue-600 rounded-xl flex items-center justify-center text-lg sm:text-xl flex-shrink-0">
        <i class="fa-solid fa-boxes-stacked"></i>
      </div>
    </div>

  </div>

  <!-- Recent Orders Section -->
  <div class="bg-white border border-slate-200 rounded-xl shadow-sm overflow-hidden">
    <div class="px-4 sm:px-6 py-4 border-b border-slate-200 flex justify-between items-center bg-slate-50">
      <h2 class="font-bold text-slate-800 text-sm sm:text-base">Recent Orders</h2>
      <a href="orders.html" class="text-xs font-semibold text-adminAccent hover:text-adminAccentHover transition">View All &rarr;</a>
    </div>

    <!-- Scrollable Table Container -->
    <div class="overflow-x-auto">
      <table class="w-full text-left text-xs sm:text-sm text-slate-600">
        <thead class="bg-slate-100 text-slate-700 uppercase text-[11px] font-semibold tracking-wider border-b border-slate-200">
          <tr class="whitespace-nowrap">
            <th class="py-3 px-4 sm:px-6">Order ID</th>
            <th class="py-3 px-4 sm:px-6">Time</th>
            <th class="py-3 px-4 sm:px-6">Total</th>
            <th class="py-3 px-4 sm:px-6">Status</th>
            <th class="py-3 px-4 sm:px-6 text-right">Action</th>
          </tr>
        </thead>
        <tbody id="recentOrdersBody" class="divide-y divide-slate-200 bg-white whitespace-nowrap">
          <tr>
            <td colspan="5" class="py-12 text-center text-slate-400">
              <i class="fa-solid fa-spinner animate-spin text-lg mr-2 text-adminAccent"></i> Loading recent orders...
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

</main>

  <!-- Scripts -->
   <script src="../js/api.js"></script>
  <script src="js/admin-auth.js"></script>
  <script src="js/dashboard.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const auth = checkAdminAuth("admin");
      if (auth) {
        const userBadge = document.getElementById("adminUserBadge");
        if (userBadge) userBadge.innerText = `Role: ${auth.role.toUpperCase()}`;

        // Hide superadmin options for standard admins
        if (auth.role !== "super_admin") {
          document.querySelectorAll(".superadmin-only").forEach(el => el.classList.add("hidden"));
        }
      }
    });
  </script>
</body>
</html>
