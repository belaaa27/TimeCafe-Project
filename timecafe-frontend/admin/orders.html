<!DOCTYPE html>
<html lang="en" class="h-full bg-slateBg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Management | TimeCafe Admin</title>
  
  <!-- Compiled Tailwind CSS -->
  <link rel="stylesheet" href="../css/output.css">
  
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="font-sans antialiased text-slate-800 bg-slateBg min-h-screen flex flex-col">

  <!-- Top Navigation Bar -->
  <header class="bg-slateDark text-white border-b border-slate-800 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between gap-2">
      <!-- Brand -->
      <div class="flex items-center gap-2.5 min-w-0">
        <div class="w-8 h-8 sm:w-9 sm:h-9 bg-adminAccent rounded-lg flex-shrink-0 flex items-center justify-center text-white font-bold text-base sm:text-lg shadow">
          <i class="fa-solid fa-receipt"></i>
        </div>
        <span class="font-bold text-base sm:text-lg tracking-tight text-slate-100 truncate">
          TimeCafe <span class="hidden sm:inline text-slate-400 text-sm font-normal">| Order Center</span>
        </span>
      </div>

      <!-- Right Controls -->
      <div class="flex items-center gap-2 sm:gap-4 flex-shrink-0">
        <span id="adminUserBadge" class="px-2.5 py-1 bg-slatePanel border border-slate-700 text-slate-300 text-[10px] sm:text-xs font-semibold rounded-full uppercase tracking-wider">
          Role: Loading...
        </span>
        <button onclick="logoutAdmin()" class="text-slate-400 hover:text-white text-xs sm:text-sm font-medium transition flex items-center gap-1.5 p-1">
          <i class="fa-solid fa-right-from-bracket"></i>
          <span class="hidden sm:inline">Logout</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Secondary Navigation (Touch-scrollable on mobile) -->
  <nav class="bg-slatePanel border-b border-slate-700/50 sticky top-16 z-40 overflow-x-auto scrollbar-none">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex gap-1 whitespace-nowrap min-w-max">
      <a href="dashboard.html" class="px-3.5 sm:px-4 py-3 text-xs sm:text-sm font-medium text-slate-400 hover:text-slate-200 border-b-2 border-transparent hover:border-slate-600 flex items-center gap-2 transition">
        <i class="fa-solid fa-chart-line"></i> Dashboard
      </a>
      <a href="orders.html" class="px-3.5 sm:px-4 py-3 text-xs sm:text-sm font-medium border-b-2 border-adminAccent text-white bg-slate-800/50 flex items-center gap-2">
        <i class="fa-solid fa-receipt"></i> Orders
      </a>
      <a href="products.html" class="px-3.5 sm:px-4 py-3 text-xs sm:text-sm font-medium text-slate-400 hover:text-slate-200 border-b-2 border-transparent hover:border-slate-600 flex items-center gap-2 transition">
        <i class="fa-solid fa-pizza-slice"></i> Products
      </a>
      <a href="staff.html" class="superadmin-only px-3.5 sm:px-4 py-3 text-xs sm:text-sm font-medium text-slate-400 hover:text-slate-200 border-b-2 border-transparent hover:border-slate-600 flex items-center gap-2 transition">
        <i class="fa-solid fa-users"></i> Staff
      </a>
    </div>
  </nav>

  <!-- Main Content Container -->
  <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 sm:py-8 space-y-6">
    
    <!-- Title & Filter Controls Header -->
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 pb-2 border-b border-slate-200">
      <div>
        <h1 class="text-xl sm:text-2xl font-bold text-slate-900 tracking-tight">Order Management</h1>
        <p class="text-xs sm:text-sm text-slate-500">View live incoming orders, update dispatch statuses, and monitor delivery details.</p>
      </div>

      <!-- Status Filter -->
      <div class="flex items-center gap-2.5 sm:gap-3 w-full sm:w-auto">
        <label for="statusFilter" class="text-xs font-semibold text-slate-500 uppercase tracking-wider flex items-center gap-1.5 whitespace-nowrap">
          <i class="fa-solid fa-filter text-slate-400"></i> Filter:
        </label>
        <select id="statusFilter" class="w-full sm:w-auto bg-white border border-slate-300 text-slate-800 text-xs sm:text-sm font-medium rounded-xl px-3.5 py-2 shadow-sm focus:outline-none focus:border-adminAccent focus:ring-1 focus:ring-adminAccent transition">
          <option value="all">All Statuses</option>
          <option value="pending">Pending</option>
          <option value="preparing">Preparing</option>
          <option value="out_for_delivery">Out for Delivery</option>
          <option value="delivered">Delivered</option>
          <option value="cancelled">Cancelled</option>
        </select>
      </div>
    </div>

    <!-- Orders Data Table -->
    <div class="bg-white border border-slate-200 rounded-xl shadow-sm overflow-hidden">
      <div class="overflow-x-auto">
        <table class="w-full text-left text-xs sm:text-sm text-slate-600">
          <thead class="bg-slate-100 text-slate-700 uppercase text-[11px] font-semibold tracking-wider border-b border-slate-200">
            <tr class="whitespace-nowrap">
              <th scope="col" class="py-3.5 px-4 sm:px-6">Order ID & Date</th>
              <th class="py-3.5 px-4 sm:px-6">Customer Snapshot</th>
              <th class="py-3.5 px-4 sm:px-6">Total Amount</th>
              <th class="py-3.5 px-4 sm:px-6">Current Status</th>
              <th class="py-3.5 px-4 sm:px-6 text-right">Update Status</th>
            </tr>
          </thead>
          <tbody id="adminOrdersBody" class="divide-y divide-slate-200 bg-white whitespace-nowrap">
            <tr>
              <td colspan="5" class="py-12 text-center text-slate-400">
                <i class="fa-solid fa-spinner animate-spin text-lg mr-2 text-adminAccent"></i> Loading orders...
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

  </main>

  <!-- Scripts -->
   <script src="../js/api.js"></script>
  <script src="js/admin-auth.js"></script>
  <script src="js/admin-orders.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const auth = checkAdminAuth("admin");
      
      if (auth) {
        const userBadge = document.getElementById("adminUserBadge");
        if (userBadge) userBadge.innerText = `Role: ${auth.role.toUpperCase()}`;

        if (auth.role !== "super_admin") {
          document.querySelectorAll(".superadmin-only").forEach(el => el.classList.add("hidden"));
        }
      }
    });
  </script>
</body>
</html>
