<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | TimeCafe Pizzeria</title>
    
    <!-- Compiled Tailwind CSS -->
    <link rel="stylesheet" href="css/output.css">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
    
    <style>
        .glass-nav {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }
        .bg-noise {
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.05'/%3E%3C/svg%3E");
        }
    </style>
</head>
<body class="font-sans bg-light text-gray-800 antialiased bg-noise min-h-screen flex flex-col justify-between">

    <!-- Header Navigation -->
    <nav class="w-full glass-nav shadow-sm py-4">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex justify-between items-center">
            <a href="index.html" class="flex items-center cursor-pointer">
                <div class="w-10 h-10 bg-primary rounded-full flex items-center justify-center text-white mr-2 shadow-md">
                    <i class="fa-solid fa-pizza-slice text-xl"></i>
                </div>
                <span class="font-serif text-2xl font-bold tracking-tight text-dark">
                    Time<span class="text-primary">Cafe</span>
                </span>
            </a>
            <div class="text-sm font-medium text-gray-600">
                Already have an account? 
                <a href="login.html" class="text-primary hover:text-primaryDark font-semibold ml-1">Sign In</a>
            </div>
        </div>
    </nav>

    <!-- Form Container -->
    <main class="flex-grow flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
        <div class="max-w-md w-full bg-white p-8 rounded-3xl shadow-xl border border-gray-100 relative overflow-hidden">
            
            <div class="text-center mb-8">
                <h1 class="text-3xl font-serif font-bold text-dark mb-2">Create an Account</h1>
                <p class="text-gray-500 text-sm">Join TimeCafe for fast delivery and exclusive offers.</p>
            </div>

            <div id="statusMessage" class="hidden mb-6 p-4 rounded-xl text-sm font-medium"></div>

            <form id="signupForm" class="space-y-4" novalidate>
                
                <div>
                    <label for="fullName" class="block text-xs font-semibold text-gray-700 uppercase tracking-wider mb-1">Full Name</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400">
                            <i class="fa-regular fa-user"></i>
                        </span>
                        <input type="text" id="fullName" name="fullName" placeholder="John Doe"
                            class="w-full pl-10 pr-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary text-sm transition-colors">
                    </div>
                    <p id="fullNameError" class="text-xs text-primary font-medium mt-1 hidden"></p>
                </div>

                <div>
                    <label for="email" class="block text-xs font-semibold text-gray-700 uppercase tracking-wider mb-1">Email Address</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400">
                            <i class="fa-regular fa-envelope"></i>
                        </span>
                        <input type="email" id="email" name="email" placeholder="john@example.com"
                            class="w-full pl-10 pr-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary text-sm transition-colors">
                    </div>
                    <p id="emailError" class="text-xs text-primary font-medium mt-1 hidden"></p>
                </div>

                <div>
                    <label for="phone" class="block text-xs font-semibold text-gray-700 uppercase tracking-wider mb-1">Phone Number</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400">
                            <i class="fa-solid fa-phone text-xs"></i>
                        </span>
                        <input type="tel" id="phone" name="phone" placeholder="+1 (555) 000-0000"
                            class="w-full pl-10 pr-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary text-sm transition-colors">
                    </div>
                    <p id="phoneError" class="text-xs text-primary font-medium mt-1 hidden"></p>
                </div>

                <div>
                    <label for="password" class="block text-xs font-semibold text-gray-700 uppercase tracking-wider mb-1">Password</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400">
                            <i class="fa-solid fa-lock text-xs"></i>
                        </span>
                        <input type="password" id="password" name="password" placeholder="••••••••"
                            class="w-full pl-10 pr-10 py-3 rounded-xl border border-gray-200 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary text-sm transition-colors">
                        <button type="button" class="password-toggle absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-dark focus:outline-none" data-target="password">
                            <i class="fa-regular fa-eye"></i>
                        </button>
                    </div>
                    <p id="passwordError" class="text-xs text-primary font-medium mt-1 hidden"></p>
                </div>

                <div>
                    <label for="confirmPassword" class="block text-xs font-semibold text-gray-700 uppercase tracking-wider mb-1">Confirm Password</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400">
                            <i class="fa-solid fa-shield-halved text-xs"></i>
                        </span>
                        <input type="password" id="confirmPassword" name="confirmPassword" placeholder="••••••••"
                            class="w-full pl-10 pr-10 py-3 rounded-xl border border-gray-200 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary text-sm transition-colors">
                        <button type="button" class="password-toggle absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-dark focus:outline-none" data-target="confirmPassword">
                            <i class="fa-regular fa-eye"></i>
                        </button>
                    </div>
                    <p id="confirmPasswordError" class="text-xs text-primary font-medium mt-1 hidden"></p>
                </div>

                <button type="submit" id="submitBtn" class="w-full mt-6 bg-primary hover:bg-primaryDark text-white font-bold py-3.5 px-4 rounded-xl shadow-3d-btn transition-all duration-150 flex justify-center items-center gap-2">
                    <span id="btnText">Register Account</span>
                    <i id="btnSpinner" class="fa-solid fa-spinner animate-spin hidden" style="display: none;"></i>
                </button>
            </form>

            <p class="text-center text-xs text-gray-400 mt-6">
                By signing up, you agree to our 
                <a href="#" class="underline hover:text-dark">Terms of Service</a> and 
                <a href="#" class="underline hover:text-dark">Privacy Policy</a>.
            </p>
        </div>
    </main>

    <footer class="py-6 text-center text-xs text-gray-400">
        &copy; 2026 TimeCafe Pizzeria. All rights reserved.
    </footer>

    <!-- JS Script Link -->
     <script src="js/api.js"></script>
    <script src="js/auth-signup.js"></script>
</body>
</html>
