<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Status | TimeCafe Pizzeria</title>
    
    <!-- Compiled Tailwind CSS -->
    <link rel="stylesheet" href="css/output.css">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
    <!-- Pizza Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍕</text></svg>">

    <style>
        .glass-nav {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }
        .bg-noise {
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.05'/%3E%3C/svg%3E");
        }
        .summary-scroll::-webkit-scrollbar { width: 5px; }
        .summary-scroll::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px; }
        .summary-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    </style>
</head>
<body class="font-sans bg-light text-gray-800 antialiased bg-noise min-h-screen flex flex-col">

    <!-- Header Navigation -->
    <nav class="w-full glass-nav shadow-sm py-4 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex justify-between items-center">
            <a href="index.html" class="flex items-center cursor-pointer">
                <div class="w-10 h-10 bg-primary rounded-full flex items-center justify-center text-white mr-2 shadow-md">
                    <i class="fa-solid fa-pizza-slice text-xl"></i>
                </div>
                <span class="font-serif text-2xl font-bold tracking-tight text-dark">
                    Time<span class="text-primary">Cafe</span>
                </span>
            </a>
            <div class="text-sm font-medium text-gray-600 flex items-center gap-4">
                <a href="index.html" class="hover:text-primary transition-colors">Menu</a>
            </div>
        </div>
    </nav>

    <!-- Main Container rendered dynamically -->
    <main id="orderConfirmationApp" class="flex-grow max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-10 w-full">
        <!-- Rendered dynamically by order-confirmation-ui.js -->
    </main>

    <footer class="py-6 text-center text-xs text-gray-400 mt-auto">
        &copy; 2026 TimeCafe Pizzeria. All rights reserved.
    </footer>

    <!-- Scripts -->
     <script src="js/api.js"></script>
    <script src="js/cart-store.js"></script>

</html>
